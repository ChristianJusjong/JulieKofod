<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Julie Kofod - Kunstner. En samling af unika kunstværker og fotografier.">
    <title>Julie Kofod | Kunstner Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="index.css">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- Custom Cursor Removed -->

<header class="minimal-header">
    <nav>
        <div class="logo">Julie Kofod</div>
        <ul class="nav-links">
            <li><a href="#intro">Start</a></li>
            <li><a href="#works">Værker</a></li>
            <li><a href="#collage">Glimt</a></li>
            <li><a href="#contact">Kontakt</a></li>
        </ul>
        <div class="mobile-menu-btn">
            <i class="fas fa-bars"></i>
        </div>
    </nav>
</header>

<main class="biography-flow">

    <!-- Intro Section with Large Image and Title -->
    <!-- Intro Section -->
    <section id="intro" class="bio-section intro-section container">
        <div class="intro-content">
            <span class="eyebrow" id="intro-overtitel"></span>
            <h1 class="main-title" id="intro-titel"></h1>
            <p class="intro-text" id="intro-tekst"></p>
            <div class="scroll-down">
                <div class="line"></div>
            </div>
        </div>
        <div class="intro-image-container parallax-effect">
            <img src="" alt="Julie Kofod Værk" class="featured-image" id="intro-billede">
        </div>
    </section>

    <!-- Philosophy Section -->
    <section id="philosophy" class="bio-section text-image-split container">
        <div class="image-wrapper reveal-on-scroll">
            <img src="" alt="Kunstnerisk proces" class="art-image" id="filosofi-billede">
            <div class="image-caption" id="filosofi-billedeTekst"></div>
        </div>
        <div class="text-wrapper reveal-on-scroll">
            <h2 id="filosofi-overskrift"></h2>
            <p id="filosofi-tekst1"></p>
            <p id="filosofi-tekst2"></p>
        </div>
    </section>

    <!-- Quote -->
    <section class="bio-section quote-break container">
        <blockquote id="citat-tekst"></blockquote>
    </section>

    <!-- Works Section -->
    <section id="works" class="bio-section works-flow container">
        <!-- Værker indsættes automatisk via JS -->
    </section>

    <!-- Collage Section -->
    <section id="collage" class="bio-section collage-section container">
        <!-- Collage indsættes automatisk via JS -->
    </section>

    <!-- About/Bio embedded -->
    <section class="bio-section artist-statement reveal-on-scroll">
        <div class="statement-content container">
            <h2 id="om-overskrift"></h2>
            <p id="om-tekst"></p>
            <p class="signature" id="om-underskrift"></p>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="contact-section container">
        <div class="contact-simple fade-in">
            <h2 id="kontakt-overskrift"></h2>
            <p id="kontakt-tekst"></p>

            <div class="contact-details">
                <a href="" id="kontakt-email"></a>
                <span class="separator">|</span>
                <a href="#" id="kontakt-instagram"></a>
            </div>

            <form class="simple-form">
                <input type="text" placeholder="Dit Navn" required>
                <input type="email" placeholder="Din Email" required>
                <textarea placeholder="Din Besked" rows="1" required></textarea>
                <button type="submit" class="link-btn">Send</button>
            </form>
        </div>
    </section>
</main>

<footer class="minimal-footer">
    <p id="site-footer"></p>
</footer>

<!-- Lightbox remains the same -->
<div id="lightbox" class="lightbox">
    <span class="close-lightbox">&times;</span>
    <div class="lightbox-controls">
        <button id="zoom-out"><i class="fas fa-minus"></i></button>
        <button id="zoom-in"><i class="fas fa-plus"></i></button>
    </div>
    <div class="lightbox-image-wrapper">
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <!-- Lightbox Caption / Metadata -->
    <div class="lightbox-caption">
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-desc"></p>
        <span id="lightbox-meta"></span>
    </div>
</div>

<script src="indhold.js"></script>
<script src="script.js"></script>

</html>
